<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Personal Expense Calculator</h1>

        <label>Monthly Income:</label>
        <input type="number" id="income" placeholder="Enter your income">

        <h2>Add Expense</h2>

        <label>Expense Name:</label>
        <input type="text" id="expenseName" placeholder="Eg: Food">

        <label>Amount:</label>
        <input type="number" id="expenseAmount" placeholder="Enter amount">

        <label>Category:</label>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Others">Others</option>
        </select>

        <button onclick="addExpense()">Add Expense</button>

        <h2>Expense List</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Amount</th>
                    <th>Category</th>
                </tr>
            </thead>

            <tbody id="expenseList">
            </tbody>
        </table>

        <button onclick="showSummary()">Calculate Summary</button>

        <div id="summary"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
